version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Raju Mandala", email = "64860940+rajumandala@users.noreply.github.com" }
]
requires-python = ">=3.13"
dependencies = [
    "langchain>=1.4.3",
    "langchain-openai>=1.6.7",
    "langgraph>=1.2.14",
    "mcp>=2.3.0",
